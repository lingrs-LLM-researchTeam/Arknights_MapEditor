name: Editor regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  route-document-binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: |
          node --check map-editor.js
          node --check map-editor.test.js
      - name: Test route document binding
        run: node --test map-editor.test.js
