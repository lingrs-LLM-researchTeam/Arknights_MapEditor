name: Import validation regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  enemy-reference-shape:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: |
          node --check map-model.js
          node --check map-model-import.test.js
      - name: Test enemy reference import boundary
        run: node --test map-model-import.test.js
